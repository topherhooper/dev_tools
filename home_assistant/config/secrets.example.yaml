# Copy to secrets.yaml (git-ignored) and fill in real values.
# CI uses this file as-is, so every !secret referenced in config must exist here.
#
# Add a placeholder here whenever you introduce a `!secret <name>`, or the CI
# config check will fail.

# The address computers post their network-watch reports to
# (packages/network_watch.yaml). Use a long random string, e.g. from
# `python3 -c "import secrets; print(secrets.token_urlsafe(32))"`.
netwatch_webhook_id: replace-with-a-long-random-string
