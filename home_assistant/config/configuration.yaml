# Home Assistant configuration — managed in git.
# Edit here, open a PR, let CI validate, then deploy (see README).
#
# Core settings (location, time zone, units, currency) are deliberately NOT
# declared here. HA owns them in .storage, set during onboarding and editable
# under Settings > System > General. A `homeassistant:` block would override
# that copy, giving two sources of truth for the same values.

# Loads frontend, cloud, mobile_app, energy, etc.
default_config:

# Themes dropped into config/themes/ on the host.
frontend:
  themes: !include_dir_merge_named themes

# HTTP settings (IP bans, login-attempt threshold, port, CORS) are stored by Home
# Assistant since the 2026.9 migration and edited in the UI; a YAML http: block
# here is ignored and raises a repair. Bans are still recorded in /config/ip_bans.yaml
# on the host; delete a line there to unban an address.

# Dashboards kept in git. Home stays UI-managed in .storage; a dashboard listed
# here is read from its file instead and can no longer be edited in the UI.
# After changing a file, use the dashboard's "Refresh" menu item (no restart).
# Custom cards (Mushroom, ApexCharts) still come from the HACS resources in
# .storage, which is why there is no `resources:` list here.
lovelace:
  dashboards:
    monitoring-hub:
      mode: yaml
      title: Monitoring Hub
      icon: mdi:monitor-dashboard
      show_in_sidebar: true
      filename: dashboards/monitoring-hub.yaml
    computers-network:
      mode: yaml
      title: Computers & Network
      icon: mdi:desktop-tower-monitor
      show_in_sidebar: true
      filename: dashboards/computers-network.yaml

logger:
  default: warning

# Each file in packages/ can bundle related automations, scripts,
# sensors, helpers, etc. for one feature or area of the house.
homeassistant:
  packages: !include_dir_named packages

# UI-editable files. The HA editor writes to these, so keep them as plain lists.
automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
