# Dust mites — a sustained-humidity watch for the rooms people sleep in.
#
# Mites need relative humidity above about 50% to thrive and dry out when it
# stays below, so the alert reads a 24-hour average rather than the live value:
# a shower or one humid evening does not matter, a week at 55% does. The
# threshold itself (DUST_MITE_RH_MAX) lives in custom_templates/house_alerts.jinja
# with every other threshold; this file only provides the averaged sensors.
#
# Master Bedroom reads the ALPSTUGA monitor, the room's canonical sensor in the
# air-quality rules (the Nest thermostat there reads ~2 points higher). Astrid's
# room has no monitor, so it reads the Nest. Kitchen and basement are not
# sleeping rooms and keep the plain "Humidity high" rule.

sensor:
  - platform: statistics
    name: Master Bedroom Humidity 24h
    unique_id: master_bedroom_humidity_24h
    entity_id: sensor.alpstuga_air_quality_monitor_humidity
    # Time-weighted: a reading counts until the next one replaces it.
    state_characteristic: average_step
    max_age:
      hours: 24
    # The monitor reports ~1,700 times a day; this is a cap, not a window.
    sampling_size: 4000
    precision: 0

  - platform: statistics
    name: Astrid's Room Humidity 24h
    unique_id: astrids_room_humidity_24h
    entity_id: sensor.astrid_s_temp_humidity
    state_characteristic: average_step
    max_age:
      hours: 24
    sampling_size: 4000
    precision: 0
