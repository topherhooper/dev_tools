# Robot vacuum — the parts of the Roborock Q5 schedule that live in YAML.
#
# The schedule itself is edited in the Home Assistant UI, not here:
#   - Days and times are two schedule helpers, "Vacuum bedrooms" and "Vacuum
#     evening rooms" (schedule.vacuum_bedrooms, schedule.vacuum_evening_rooms).
#   - The automations that start a run, reset the skips and send the bedroom
#     reminder are in automations.yaml (ids vacuum_*), which the UI owns.
#   - Each room, and the evening run as a whole, has a "skip" switch created as
#     a UI helper (input_boolean.vacuum_skip_<room>, input_boolean.skip_evening_vacuum).
#     A skip applies to one run and is reset when the schedule block ends.
# The Roborock app's own scheduled cleaning must stay switched off, or it runs
# alongside these.
#
# This file keeps what the UI cannot hold as well: the script that cleans rooms
# one at a time, and "Skip next bedroom vacuum", which predates the UI helpers.
#
# Why one room at a time: in a single pass the bin filled up partway and the
# robot came home with half its battery left and rooms unfinished; the dock
# only empties the bin between runs, so each room gets an empty bin. The Living
# room goes last because that is where the robot gets trapped, and a trap stops
# the sequence rather than costing the other rooms.
#
# Why the bedrooms have their own run: the evening runs happen when the bedrooms
# are occupied. No sensor in the house can tell when the kids are unexpectedly
# home (sick day, daycare closed), so that is a switch, offered as a button on a
# reminder the evening before. Upstairs is beyond the robot.
#
# Segment ids come from the roborock.get_maps action (map 0). Room names are
# edited in the Roborock app; after a rename, reload the Roborock integration
# or get_maps keeps returning the old ones.
#   16 Green room, 17 Living room, 18 Bathroom, 19 Kitchen,
#   20 Large bedroom, 21 Dining room, 22 Small Bedroom, 23 Corridor
# (checked 2026-11-10)

input_boolean:
  skip_bedroom_vacuum:
    name: Skip next bedroom vacuum
    icon: mdi:robot-vacuum-off

script:
  robot_vacuum_rooms_one_at_a_time:
    alias: Robot vacuum - clean rooms one at a time
    description: >-
      Segment-cleans each room in turn, waiting for the robot to dock and the
      dock to empty the bin before the next. Stops at the first error, or if a
      room does not start or finish in time.
    icon: mdi:robot-vacuum
    mode: single
    fields:
      segments:
        name: Segments
        description: Room segment ids from roborock.get_maps, in cleaning order.
        required: true
        example: "[19, 21]"
    sequence:
      - repeat:
          for_each: "{{ segments }}"
          sequence:
            - action: vacuum.send_command
              target:
                entity_id: vacuum.roborock_q5
              data:
                command: app_segment_clean
                params:
                  - segments: ["{{ repeat.item }}"]
                    repeat: 1
            - wait_for_trigger:
                - trigger: state
                  entity_id: vacuum.roborock_q5
                  to: cleaning
              timeout: "00:02:00"
              continue_on_timeout: false
            - wait_for_trigger:
                - trigger: state
                  entity_id: vacuum.roborock_q5
                  to: docked
                  id: docked
                - trigger: state
                  entity_id: vacuum.roborock_q5
                  to: error
                  id: error
              timeout: "01:00:00"
              continue_on_timeout: false
            - if:
                - condition: template
                  value_template: "{{ wait.trigger.id == 'error' }}"
              then:
                - stop: Robot reported an error; leaving the remaining rooms.
            # Auto-empty runs as soon as it docks and takes under a minute.
            - delay: "00:03:00"
