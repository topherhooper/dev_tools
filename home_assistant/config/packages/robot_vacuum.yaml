# Robot vacuum schedule — the bedroom it can reach.
#
# The Roborock Q5 lives downstairs and runs its own routines at night, when the
# bedrooms are occupied, so the one bedroom on its map was never cleaned. This
# sends it there on weekday mornings instead. Upstairs is beyond the robot; the
# cleaner covers the whole house every two weeks.
#
# Segment ids come from the roborock.get_maps action (map 0):
#   16 Study, 18 Bathroom, 19 Kitchen, 20 Guest bedroom, 21 Dining room.

automation:
  - id: robot_vacuum_guest_bedroom
    alias: Robot vacuum - guest bedroom twice a week
    description: >-
      Segment-cleans the guest bedroom on Tuesday and Friday mornings, if the
      robot is docked and reports no error.
    mode: single
    triggers:
      - trigger: time
        at: "10:30:00"
    conditions:
      - condition: time
        weekday: [tue, fri]
      - condition: state
        entity_id: vacuum.roborock_q5
        state: docked
      - condition: state
        entity_id: sensor.roborock_q5_vacuum_error
        state: none
    actions:
      - action: vacuum.send_command
        target:
          entity_id: vacuum.roborock_q5
        data:
          command: app_segment_clean
          params:
            - segments: [20]
              repeat: 1
