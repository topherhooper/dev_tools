# Robot vacuum schedule — the bedrooms it can reach.
#
# The Roborock Q5 lives downstairs and runs its own routines at night, when the
# bedrooms are occupied, so the two bedrooms on its map were never cleaned. This
# sends it there on weekday mornings instead. Upstairs is beyond the robot; the
# cleaner covers the whole house every two weeks.
#
# Segment ids come from the roborock.get_maps action (map 0). Room names are
# edited in the Roborock app; after a rename, reload the Roborock integration
# or get_maps keeps returning the old ones.
#   16 Green room, 17 Living room, 18 Bathroom, 19 Kitchen,
#   20 Large bedroom, 21 Dining room, 22 Small Bedroom

automation:
  - id: robot_vacuum_downstairs_bedrooms
    alias: Robot vacuum - downstairs bedrooms twice a week
    description: >-
      Segment-cleans the Large and Small bedrooms on Tuesday and Friday
      mornings, if the robot is docked, reports no error, and nobody is asleep
      in Astrid's room (the Hatch sound machine is not playing).
    mode: single
    triggers:
      - trigger: time
        at: "10:30:00"
    conditions:
      - condition: time
        weekday: [tue, fri]
      - condition: state
        entity_id: vacuum.roborock_q5
        state: docked
      - condition: state
        entity_id: sensor.roborock_q5_vacuum_error
        state: none
      # The Hatch plays white noise whenever Astrid is put down; a nap at 10:30
      # is more likely than not on some days, and the robot is loud.
      - condition: not
        conditions:
          - condition: state
            entity_id: media_player.astrid_media_player
            state: playing
    actions:
      - action: vacuum.send_command
        target:
          entity_id: vacuum.roborock_q5
        data:
          command: app_segment_clean
          params:
            - segments: [20, 22]
              repeat: 1
