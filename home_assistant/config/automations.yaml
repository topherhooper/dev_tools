- id: '1773714248282'
  alias: Air Quality - PM2.5 High Alert
  description: Notify when PM2.5 exceeds 35 µg/m³ for 5 minutes on any ALPSTUGA monitor
  triggers:
  - alias: Master Bedroom PM2.5 above 35 µg/m³
    platform: numeric_state
    entity_id: sensor.alpstuga_air_quality_monitor_pm2_5
    above: 35
    for:
      minutes: 5
  - alias: Main Floor PM2.5 above 35 µg/m³
    platform: numeric_state
    entity_id: sensor.alpstuga_air_quality_monitor_pm2_5_2
    above: 35
    for:
      minutes: 5
  - alias: Basement PM2.5 above 35 µg/m³
    platform: numeric_state
    entity_id: sensor.alpstuga_air_quality_monitor_pm2_5_3
    above: 35
    for:
      minutes: 5
  conditions:
  - condition: template
    value_template: '{{ (now() - state_attr(''automation.air_quality_pm2_5_high_alert'',
      ''last_triggered'') | default(now() - timedelta(hours=2), true)).total_seconds()
      > 3600 }}'
  actions:
  - data:
      title: ⚠️ Air Quality Alert
      message: PM2.5 is {{ trigger.to_state.state }} µg/m³ in {% if trigger.entity_id
        == 'sensor.alpstuga_air_quality_monitor_pm2_5' %}Master Bedroom{% elif trigger.entity_id
        == 'sensor.alpstuga_air_quality_monitor_pm2_5_2' %}Main Floor{% else %}Basement{%
        endif %}
    action: notify.mobile_app_pixel_8
  mode: single
