- id: '1773714296420'
  alias: Vacuum - Parts Overdue Check
  description: Daily 10am check for overdue Roborock Q5 maintenance parts
  triggers:
  - platform: time
    at: '10:00:00'
  conditions:
  - condition: template
    value_template: '{{ states(''sensor.roborock_q5_filter_time_left'') | float(0) <
      0 or states(''sensor.roborock_q5_side_brush_time_left'') | float(0) < 0 or states(''sensor.roborock_q5_sensor_time_left'')
      | float(0) < 0 or states(''sensor.roborock_q5_main_brush_time_left'') | float(999) <
      10 }}'
  actions:
  - data:
      title: "\U0001F9F9 Roborock Maintenance"
      message: 'Parts needing attention:

        {% if states(''sensor.roborock_q5_filter_time_left'') | float(0) < 0 %}- Filter:
        {{ states(''sensor.roborock_q5_filter_time_left'') | float(0) | abs | round(0)
        }}h overdue

        {% endif %}{% if states(''sensor.roborock_q5_side_brush_time_left'') | float(0)
        < 0 %}- Side brush: {{ states(''sensor.roborock_q5_side_brush_time_left'')
        | float(0) | abs | round(0) }}h overdue

        {% endif %}{% if states(''sensor.roborock_q5_sensor_time_left'') | float(0) <
        0 %}- Sensors: {{ states(''sensor.roborock_q5_sensor_time_left'') | float(0)
        | abs | round(0) }}h overdue

        {% endif %}{% if states(''sensor.roborock_q5_main_brush_time_left'') | float(999)
        < 10 %}- Main brush: {{ states(''sensor.roborock_q5_main_brush_time_left'')
        | float(0) | round(0) }}h remaining

        {% endif %}'
    action: notify.mobile_app_pixel_8
  mode: single
- id: '1773714304724'
  alias: Vacuum - Error Alert
  description: Immediately notify when Roborock Q5 encounters an error
  triggers:
  - platform: state
    entity_id: sensor.roborock_q5_vacuum_error
  conditions:
  - condition: template
    value_template: '{{ trigger.to_state.state != ''none'' and trigger.to_state.state
      != ''unavailable'' and trigger.to_state.state != ''unknown'' }}'
  actions:
  - data:
      title: "\U0001F6A8 Roborock Error"
      message: 'Vacuum error: {{ states(''sensor.roborock_q5_vacuum_error'') }}'
    action: notify.mobile_app_pixel_8
  mode: single
