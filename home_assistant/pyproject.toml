[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hactl"
version = "0.1.0"
description = "Tools for managing a Home Assistant install from config-as-code"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "yamllint>=1.35"]

[project.scripts]
hactl = "hactl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hactl"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
